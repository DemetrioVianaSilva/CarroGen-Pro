        .color-preview {

        .gradient-grid {

        // ==========================================

        const AuthContext = createContext();

        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                    if (session?.user) {
                        loadProfile(session.user.id);
                    } else {
                        setLoading(false);
                    }
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                    if (session?.user) {
                        loadProfile(session.user.id);
                    } else {
                        setProfile(null);
                        setLoading(false);
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            const loadProfile = async (userId) => {
                try {
                    const { data, error } = await supabase
                        .from('user_profiles')
                        .select('*')
                        .eq('id', userId)
                        .single();

                    if (error) throw error;
                    setProfile(data);
                } catch (error) {
                    console.error('Error loading profile:', error);
                } finally {
                    setLoading(false);
                }
            };

            const signIn = async (email, password) => {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                return { data, error };
            };

            const signUp = async (email, password, instagramHandle) => {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (!error && data.user) {
                    await supabase.from('user_profiles').insert({
                        id: data.user.id,
                        role: 'admin',
                        instagram_handle: instagramHandle,
                    });
                }
                return { data, error };
            };

            const signOut = async () => {
                await supabase.auth.signOut();
            };

            return (
                <AuthContext.Provider value={{ user, profile, loading, signIn, signUp, signOut }}>
                    {children}
                </AuthContext.Provider>
            );
        };

                                        📧 Enviamos um link de confirmação para <strong>{email}</strong>
                                    </p>
                                    <p style={{ fontSize: '0.85rem', marginTop: '0.5rem', opacity: 0.8 }}>
                                        💡 <strong>Importante:</strong> Se não encontrar o email, verifique sua caixa de SPAM ou Lixo Eletrônico.
                                    </p>
                                </div>
                            </div>
                        )}

                        <form onSubmit={handleSubmit}>
                            <div style={{ marginBottom: '1rem' }}>
                                <label className="label">Email</label>
                                <input
                                    type="email"
                                    className="input"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                />
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label className="label">Senha</label>
                                <input
                                    type="password"
                                    className="input"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                />
                            </div>

                            {!isLogin && (
                                <div style={{ marginBottom: '1rem' }}>
                                    <label className="label">Instagram (opcional)</label>
                                    <input
                                        type="text"
                                        className="input"
                                        value={instagramHandle}
                                        onChange={(e) => setInstagramHandle(e.target.value)}
                                        placeholder="@seu_usuario"
                                    />
                                </div>
                            )}

                            <button
                                type="submit"
                                className="btn btn-primary"
                                style={{ width: '100%', justifyContent: 'center', marginBottom: '1rem' }}
                                disabled={loading}
                            >
                                {loading ? <span className="loading"></span> : (isLogin ? 'Entrar' : 'Criar Conta')}
                            </button>
                        </form>

                        <div style={{ textAlign: 'center', paddingTop: '1rem', borderTop: '1px solid var(--border)' }}>
                            <button
                                className="btn btn-secondary"
                                style={{ width: '100%', justifyContent: 'center' }}
                                onClick={() => {
                                    setIsLogin(!isLogin);
                                    setError('');
                                    setSuccess('');
                                }}
                            >
                                {isLogin ? 'Criar nova conta' : 'Já tenho conta'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const EditorV2 = () => {
            const [project, setProject] = useState({ name: 'Novo Projeto', slidesCount: 5 });
            const [slides, setSlides] = useState([]);
            const [currentSlide, setCurrentSlide] = useState(0);
            const [selectedElement, setSelectedElement] = useState(null);
            const [dragging, setDragging] = useState(false);
            const [resizing, setResizing] = useState(false);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [resizeStart, setResizeStart] = useState({ x: 0, y: 0, width: 0, height: 0 });
            const canvasRef = useRef(null);

            useEffect(() => {
                if (slides.length === 0) {
                    initializeSlides(project.slidesCount);
                }
            }, []);

            useEffect(() => {
                const currentCount = slides.length;
                const newCount = project.slidesCount;

                if (newCount > currentCount) {
                    const additionalSlides = Array.from({ length: newCount - currentCount }, (_, i) => ({
                        id: currentCount + i,
                        backgroundImage: null,
                        images: [],
                        textElements: [{
                            id: Date.now() + currentCount + i,
                            text: `Slide ${currentCount + i + 1}`,
                            x: 50, y: 50, width: 70, height: 15,
                            fontSize: 48, fontFamily: 'Outfit',
                            color: '#ffffff', backgroundColor: 'rgba(0, 0, 0, 0.7)',
                            textAlign: 'center', fontWeight: '700',
                            padding: 20, borderRadius: '12px',
                            zIndex: 1,
                        }],
                    }));
                    setSlides([...slides, ...additionalSlides]);
                } else if (newCount < currentCount) {
                    setSlides(slides.slice(0, newCount));
                    if (currentSlide >= newCount) {
                        setCurrentSlide(newCount - 1);
                    }
                }
            }, [project.slidesCount]);

            const initializeSlides = (count) => {
                const newSlides = Array.from({ length: count }, (_, i) => ({
                    id: i,
                    backgroundImage: null,
                    images: [],
                    textElements: [{
                        id: Date.now() + i,
                        text: `Slide ${i + 1}`,
                        x: 50, y: 50, width: 70, height: 15,
                        fontSize: 48, fontFamily: 'Outfit',
                        color: '#ffffff', backgroundColor: 'rgba(0, 0, 0, 0.7)',
                        textAlign: 'center', fontWeight: '700',
                        padding: 20, borderRadius: '12px',
                        zIndex: 1,
                    }],
                }));
                setSlides(newSlides);
            };

            const handleBackgroundUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const newSlides = [...slides];
                        newSlides[currentSlide].backgroundImage = event.target.result;
                        setSlides(newSlides);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const aspectRatio = img.height / img.width;
                            const newImage = {
                                id: Date.now(),
                                src: event.target.result,
                                x: 25,
                                y: 25,
                                width: 50,
                                height: 50 * aspectRatio,
                                zIndex: (slides[currentSlide]?.images?.length || 0) + (slides[currentSlide]?.textElements?.length || 0) + 1,
                            };
                            const newSlides = [...slides];
                            if (!newSlides[currentSlide].images) {
                                newSlides[currentSlide].images = [];
                            }
                            newSlides[currentSlide].images.push(newImage);
                            setSlides(newSlides);
                            setSelectedElement({ type: 'image', id: newImage.id });
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            };

            const addTextElement = () => {
                const maxZIndex = Math.max(
                    ...slides[currentSlide].textElements.map(el => el.zIndex || 0),
                    ...slides[currentSlide].images.map(img => img.zIndex || 0),
                    0
                );

                const newElement = {
                    id: Date.now(),
                    text: 'Novo Texto',
                    x: 30, y: 30, width: 50, height: 15,
                    fontSize: 36, fontFamily: 'Outfit',
                    color: '#ffffff', backgroundColor: 'rgba(0, 0, 0, 0.7)',
                    textAlign: 'center', fontWeight: '600',
                    padding: 16, borderRadius: '8px',
                    zIndex: maxZIndex + 1,
                };

                const newSlides = [...slides];
                newSlides[currentSlide].textElements.push(newElement);
                setSlides(newSlides);
                setSelectedElement({ type: 'text', id: newElement.id });
            };

            const updateElement = (type, elementId, updates) => {
                const newSlides = [...slides];
                if (type === 'text') {
                    const element = newSlides[currentSlide].textElements.find(el => el.id === elementId);
                    if (element) Object.assign(element, updates);
                } else if (type === 'image') {
                    const element = newSlides[currentSlide].images.find(el => el.id === elementId);
                    if (element) Object.assign(element, updates);
                }
                setSlides(newSlides);
            };

            const deleteElement = (type, elementId) => {
                const newSlides = [...slides];
                if (type === 'text') {
                    newSlides[currentSlide].textElements = newSlides[currentSlide].textElements.filter(
                        el => el.id !== elementId
                    );
                } else if (type === 'image') {
                    newSlides[currentSlide].images = newSlides[currentSlide].images.filter(
                        el => el.id !== elementId
                    );
                }
                setSlides(newSlides);
                setSelectedElement(null);
            };

            const changeZIndex = (type, elementId, direction) => {
                const newSlides = [...slides];
                const currentSlideData = newSlides[currentSlide];

                currentSlideData.textElements.forEach((el, idx) => {
                    if (el.zIndex === undefined) el.zIndex = idx;
                });
                currentSlideData.images.forEach((el, idx) => {
                    if (el.zIndex === undefined) el.zIndex = idx + currentSlideData.textElements.length;
                });

                const allElements = [
                    ...currentSlideData.textElements.map(el => ({ ...el, type: 'text' })),
                    ...currentSlideData.images.map(el => ({ ...el, type: 'image' }))
                ].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));

                const elementIndex = allElements.findIndex(el => el.type === type && el.id === elementId);
                if (elementIndex === -1) return;

                if (direction === 'up' && elementIndex < allElements.length - 1) {
                    const currentZ = allElements[elementIndex].zIndex;
                    const nextZ = allElements[elementIndex + 1].zIndex;
                    allElements[elementIndex].zIndex = nextZ;
                    allElements[elementIndex + 1].zIndex = currentZ;
                } else if (direction === 'down' && elementIndex > 0) {
                    const currentZ = allElements[elementIndex].zIndex;
                    const prevZ = allElements[elementIndex - 1].zIndex;
                    allElements[elementIndex].zIndex = prevZ;
                    allElements[elementIndex - 1].zIndex = currentZ;
                }

                allElements.forEach(el => {
                    if (el.type === 'text') {
                        const textEl = currentSlideData.textElements.find(t => t.id === el.id);
                        if (textEl) textEl.zIndex = el.zIndex;
                    } else {
                        const imgEl = currentSlideData.images.find(i => i.id === el.id);
                        if (imgEl) imgEl.zIndex = el.zIndex;
                    }
                });

                setSlides(newSlides);
            };

            const handleMouseDown = (e, type, elementId) => {
                if (e.target.classList.contains('resize-handle')) {
                    handleResizeStart(e, type, elementId);
                    return;
                }

                e.preventDefault();
                e.stopPropagation();
                setSelectedElement({ type, id: elementId });
                setDragging(true);

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();

                let element;
                if (type === 'text') {
                    element = slides[currentSlide].textElements.find(el => el.id === elementId);
                } else {
                    element = slides[currentSlide].images.find(el => el.id === elementId);
                }

                const offsetX = ((e.clientX - rect.left) / rect.width * 100) - element.x;
                const offsetY = ((e.clientY - rect.top) / rect.height * 100) - element.y;

                setDragOffset({ x: offsetX, y: offsetY });
            };

            const handleTouchStart = (e, type, elementId) => {
                const touch = e.touches[0];
                handleMouseDown({
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    preventDefault: () => e.preventDefault(),
                    stopPropagation: () => e.stopPropagation(),
                    target: e.target
                }, type, elementId);
            };

            const handleResizeStart = (e, type, elementId) => {
                e.preventDefault();
                e.stopPropagation();
                setResizing(true);
                setSelectedElement({ type, id: elementId });

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();

                let element;
                if (type === 'text') {
                    element = slides[currentSlide].textElements.find(el => el.id === elementId);
                } else {
                    element = slides[currentSlide].images.find(el => el.id === elementId);
                }

                setResizeStart({
                    x: e.clientX,
                    y: e.clientY,
                    width: element.width,
                    height: element.height || element.width,
                    aspectRatio: type === 'image' ? (element.height / element.width) : null,
                });
            };

            const handleMouseMove = (e) => {
                if (resizing && selectedElement) {
                    const canvas = canvasRef.current;
                    const rect = canvas.getBoundingClientRect();

                    const deltaX = (e.clientX - resizeStart.x) / rect.width * 100;

                    const newWidth = Math.max(10, resizeStart.width + deltaX);

                    if (selectedElement.type === 'image' && resizeStart.aspectRatio) {
                        const newHeight = newWidth * resizeStart.aspectRatio;
                        updateElement(selectedElement.type, selectedElement.id, {
                            width: newWidth,
                            height: newHeight
                        });
                    } else {
                        const deltaY = (e.clientY - resizeStart.y) / rect.height * 100;
                        const newHeight = Math.max(10, resizeStart.height + deltaY);
                        updateElement(selectedElement.type, selectedElement.id, {
                            width: newWidth,
                            height: newHeight
                        });
                    }
                } else if (dragging && selectedElement) {
                    const canvas = canvasRef.current;
                    const rect = canvas.getBoundingClientRect();

                    const x = ((e.clientX - rect.left) / rect.width * 100) - dragOffset.x;
                    const y = ((e.clientY - rect.top) / rect.height * 100) - dragOffset.y;

                    const clampedX = Math.max(0, Math.min(100, x));
                    const clampedY = Math.max(0, Math.min(100, y));

                    updateElement(selectedElement.type, selectedElement.id, { x: clampedX, y: clampedY });
                }
            };

            const handleTouchMove = (e) => {
                const touch = e.touches[0];
                handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
            };

            const handleMouseUp = () => {
                setDragging(false);
                setResizing(false);
            };

            useEffect(() => {
                if (dragging || resizing) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    window.addEventListener('touchmove', handleTouchMove);
                    window.addEventListener('touchend', handleMouseUp);
                    return () => {
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('mouseup', handleMouseUp);
                        window.removeEventListener('touchmove', handleTouchMove);
                        window.removeEventListener('touchend', handleMouseUp);
                    };
                }
            }, [dragging, resizing, selectedElement, dragOffset, resizeStart]);

            const applyTemplate = (template) => {
                const newSlides = [...slides];
                newSlides[currentSlide].textElements = JSON.parse(JSON.stringify(template.textElements)).map(el => ({
                    ...el,
                    id: Date.now() + Math.random(),
                    padding: el.padding || 20,
                    borderRadius: el.borderRadius || '12px',
                    zIndex: el.zIndex || 1,
                }));
                setSlides(newSlides);
            };

            const exportSlides = async () => {
                const zip = new JSZip();

                for (let i = 0; i < slides.length; i++) {
                    const exportDiv = document.createElement('div');
                    exportDiv.className = 'export-canvas';
                    exportDiv.style.width = '1080px';
                    exportDiv.style.height = '1350px';
                    exportDiv.style.position = 'relative';
                    exportDiv.style.background = slides[i].backgroundImage ?
                        `url(${slides[i].backgroundImage}) center/cover` : '#f3f4f6';

                    const allElements = [
                        ...slides[i].images.map(el => ({ ...el, type: 'image' })),
                        ...slides[i].textElements.map(el => ({ ...el, type: 'text' }))
                    ].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));

                    allElements.forEach(element => {
                        if (element.type === 'image') {
                            const img = document.createElement('img');
                            img.src = element.src;
                            img.style.position = 'absolute';
                            img.style.left = `${element.x}%`;
                            img.style.top = `${element.y}%`;
                            img.style.width = `${element.width}%`;
                            img.style.height = `${element.height}%`;
                            img.style.objectFit = 'cover';
                            exportDiv.appendChild(img);
                        } else {
                            const textDiv = document.createElement('div');
                            textDiv.textContent = element.text;
                            textDiv.style.position = 'absolute';
                            textDiv.style.left = `${element.x}%`;
                            textDiv.style.top = `${element.y}%`;
                            textDiv.style.width = `${element.width}%`;
                            textDiv.style.fontSize = `${element.fontSize}px`;
                            textDiv.style.fontFamily = element.fontFamily;
                            textDiv.style.color = element.color;
                            textDiv.style.background = element.backgroundColor;
                            textDiv.style.textAlign = element.textAlign;
                            textDiv.style.fontWeight = element.fontWeight;
                            textDiv.style.padding = `${element.padding}px`;
                            textDiv.style.borderRadius = element.borderRadius || '12px';
                            textDiv.style.textShadow = element.textShadow || '2px 2px 4px rgba(0,0,0,0.5)';
                            textDiv.style.wordWrap = 'break-word';
                            textDiv.style.whiteSpace = 'pre-wrap';
                            exportDiv.appendChild(textDiv);
                        }
                    });

                    document.body.appendChild(exportDiv);

                    await new Promise(resolve => setTimeout(resolve, 100));

                    const canvas = await html2canvas(exportDiv, {
                        width: 1080,
                        height: 1350,
                        scale: 3,
                        backgroundColor: '#ffffff',
                        useCORS: true,
                    });

                    document.body.removeChild(exportDiv);

                    const dataUrl = canvas.toDataURL('image/png', 1.0);
                    const base64Data = dataUrl.split(',')[1];
                    zip.file(`slide-${i + 1}.png`, base64Data, { base64: true });
                }

                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, `${project.name || 'carrossel'}.zip`);
            };

            const getCurrentElement = () => {
                if (!selectedElement) return null;
                if (selectedElement.type === 'text') {
                    return slides[currentSlide]?.textElements.find(el => el.id === selectedElement.id);
                } else {
                    return slides[currentSlide]?.images.find(el => el.id === selectedElement.id);
                }
            };

            const currentElement = getCurrentElement();

            return (
                <div className="editor-container">
                    <div className="sidebar">
                        <div className="card" style={{ marginBottom: '1rem' }}>
                            <h3 style={{ marginBottom: '1rem' }}>📐 Projeto</h3>
                            <div style={{ marginBottom: '1rem' }}>
                                <label className="label">Nome</label>
                                <input
                                    type="text"
                                    className="input"
                                    value={project.name}
                                    onChange={(e) => setProject({...project, name: e.target.value})}
                                />
                            </div>
                            <div>
                                <label className="label">Slides: {project.slidesCount}</label>
                                <input
                                    type="range"
                                    className="slider"
                                    min="1"
                                    max="10"
                                    value={project.slidesCount}
                                    onChange={(e) => setProject({...project, slidesCount: parseInt(e.target.value)})}
                                />
                            </div>
                        </div>

                        <div className="card">
                            <h3 style={{ marginBottom: '1rem' }}>🎨 Templates</h3>
                            <div className="template-grid">
                                {TEMPLATES.map(template => (
                                    <div key={template.id} style={{ marginBottom: '1rem' }}>
                                        <div
                                            className="template-card"
                                            onClick={() => applyTemplate(template)}
                                            style={{
                                                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                                display: 'flex',
                                                alignItems: 'center',
                                                justifyContent: 'center',
                                                color: 'white',
                                                fontWeight: '600',
                                                fontSize: '0.85rem',
                                                marginBottom: '0.5rem',
                                            }}
                                        >
                                            {template.name}
                                        </div>
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.25rem' }}>
                                            {template.colors.map((colorScheme, idx) => (
                                                <div
                                                    key={idx}
                                                    onClick={() => {
                                                        const templateWithColor = {
                                                            ...template,
                                                            textElements: template.textElements.map(el => ({
                                                                ...el,
                                                                color: colorScheme.text,
                                                                backgroundColor: colorScheme.bg
                                                            }))
                                                        };
                                                        applyTemplate(templateWithColor);
                                                    }}
                                                    style={{
                                                        height: '30px',
                                                        background: colorScheme.bg,
                                                        borderRadius: '0.25rem',
                                                        cursor: 'pointer',
                                                        border: '2px solid transparent',
                                                        transition: 'all 0.3s',
                                                    }}
                                                    onMouseEnter={(e) => e.target.style.borderColor = 'var(--accent)'}
                                                    onMouseLeave={(e) => e.target.style.borderColor = 'transparent'}
                                                ></div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="canvas-area">
                        <div className="toolbar">
                            <div className="toolbar-group">
                                <button className="icon-btn" onClick={addTextElement} title="Adicionar Texto">
                                    T
                                </button>
                                <label className="icon-btn" title="Adicionar Imagem">
                                    🖼️
                                    <input
                                        type="file"
                                        accept="image/*"
                                        onChange={handleImageUpload}
                                        style={{ display: 'none' }}
                                    />
                                </label>
                                <label className="icon-btn" title="Fundo">
                                    🎨
                                    <input
                                        type="file"
                                        accept="image/*"
                                        onChange={handleBackgroundUpload}
                                        style={{ display: 'none' }}
                                    />
                                </label>
                            </div>
                            <div className="toolbar-group">
                                {currentElement && (
                                    <>
                                        <button
                                            className="icon-btn"
                                            onClick={() => changeZIndex(selectedElement.type, selectedElement.id, 'up')}
                                            title="Trazer Frente"
                                        >
                                            ⬆️
                                        </button>
                                        <button
                                            className="icon-btn"
                                            onClick={() => changeZIndex(selectedElement.type, selectedElement.id, 'down')}
                                            title="Enviar Fundo"
                                        >
                                            ⬇️
                                        </button>
                                        <button
                                            className="icon-btn"
                                            onClick={() => deleteElement(selectedElement.type, selectedElement.id)}
                                            title="Deletar"
                                        >
                                            🗑️
                                        </button>
                                    </>
                                )}
                            </div>
                            <div className="toolbar-group">
                                <button className="btn btn-primary" onClick={exportSlides}>
                                    📥 Exportar
                                </button>
                            </div>
                        </div>

                        <div style={{ display: 'flex', gap: '0.5rem', overflowX: 'auto', padding: '0.5rem' }}>
                            {slides.map((slide, index) => (
                                <button
                                    key={slide.id}
                                    onClick={() => setCurrentSlide(index)}
                                    className={`btn ${currentSlide === index ? 'btn-primary' : 'btn-secondary'}`}
                                    style={{ minWidth: '100px' }}
                                >
                                    Slide {index + 1}
                                </button>
                            ))}
                        </div>

                        <div
                            ref={canvasRef}
                            className="canvas"
                            style={{
                                backgroundImage: slides[currentSlide]?.backgroundImage ?
                                    `url(${slides[currentSlide].backgroundImage})` : 'none',
                                backgroundColor: slides[currentSlide]?.backgroundImage ? 'transparent' : '#f3f4f6',
                                backgroundSize: 'cover',
                                backgroundPosition: 'center',
                            }}
                            onClick={(e) => {
                                if (e.target === e.currentTarget) {
                                    setSelectedElement(null);
                                }
                            }}
                        >
                            {slides[currentSlide] && [
                                ...slides[currentSlide].images.map(img => ({ ...img, type: 'image' })),
                                ...slides[currentSlide].textElements.map(txt => ({ ...txt, type: 'text' }))
                            ].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0)).map((element) => {
                                if (element.type === 'image') {
                                    return (
                                        <div
                                            key={element.id}
                                            className={`image-element element ${selectedElement?.type === 'image' && selectedElement?.id === element.id ? 'selected' : ''}`}
                                            onMouseDown={(e) => handleMouseDown(e, 'image', element.id)}
                                            onTouchStart={(e) => handleTouchStart(e, 'image', element.id)}
                                            style={{
                                                left: `${element.x}%`,
                                                top: `${element.y}%`,
                                                width: `${element.width}%`,
                                                height: `${element.height}%`,
                                                cursor: dragging ? 'grabbing' : 'move',
                                                zIndex: element.zIndex || 0,
                                            }}
                                        >
                                            <img
                                                src={element.src}
                                                alt="Uploaded"
                                                style={{
                                                    width: '100%',
                                                    height: '100%',
                                                    objectFit: 'contain',
                                                    pointerEvents: 'none'
                                                }}
                                            />
                                            {selectedElement?.type === 'image' && selectedElement?.id === element.id && (
                                                <div className="resize-handle"></div>
                                            )}
                                        </div>
                                    );
                                } else {
                                    return (
                                        <div
                                            key={element.id}
                                            className={`text-element element ${selectedElement?.type === 'text' && selectedElement?.id === element.id ? 'selected' : ''}`}
                                            onMouseDown={(e) => handleMouseDown(e, 'text', element.id)}
                                            onTouchStart={(e) => handleTouchStart(e, 'text', element.id)}
                                            style={{
                                                left: `${element.x}%`,
                                                top: `${element.y}%`,
                                                width: `${element.width}%`,
                                                height: `${element.height}%`,
                                                fontSize: `${element.fontSize}px`,
                                                fontFamily: element.fontFamily,
                                                color: element.color,
                                                background: element.backgroundColor,
                                                textAlign: element.textAlign,
                                                fontWeight: element.fontWeight,
                                                padding: `${element.padding}px`,
                                                borderRadius: element.borderRadius,
                                                textShadow: element.textShadow || '2px 2px 4px rgba(0,0,0,0.5)',
                                                cursor: dragging ? 'grabbing' : 'move',
                                                zIndex: element.zIndex || 0,
                                            }}
                                        >
                                            {element.text}
                                            {selectedElement?.type === 'text' && selectedElement?.id === element.id && (
                                                <div className="resize-handle"></div>
                                            )}
                                        </div>
                                    );
                                }
                            })}
                        </div>
                    </div>

                    <div className="preview-area">
                        {currentElement ? (
                            <div className="card">
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                    <h3>⚙️ Propriedades</h3>
                                    <button
                                        className="btn btn-secondary"
                                        style={{ padding: '0.5rem 1rem', fontSize: '0.85rem' }}
                                        onClick={() => setSelectedElement(null)}
                                    >
                                        ✕
                                    </button>
                                </div>

                                {selectedElement.type === 'text' ? (
                                    <>
                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Texto</label>
                                            <textarea
                                                className="input"
                                                value={currentElement.text}
                                                onChange={(e) => updateElement('text', currentElement.id, { text: e.target.value })}
                                                rows="3"
                                            />
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Fonte</label>
                                            <select
                                                className="input"
                                                value={currentElement.fontFamily}
                                                onChange={(e) => updateElement('text', currentElement.id, { fontFamily: e.target.value })}
                                            >
                                                {FONTS.map(font => (
                                                    <option key={font} value={font} style={{ fontFamily: font }}>
                                                        {font}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Tamanho: {currentElement.fontSize}px</label>
                                            <input
                                                type="range"
                                                className="slider"
                                                min="12"
                                                max="120"
                                                value={currentElement.fontSize}
                                                onChange={(e) => updateElement('text', currentElement.id, { fontSize: parseInt(e.target.value) })}
                                            />
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Cor do Texto</label>
                                            <div className="color-picker-wrapper">
                                                <div
                                                    className="color-preview"
                                                    style={{ backgroundColor: currentElement.color }}
                                                ></div>
                                                <input
                                                    type="color"
                                                    className="input"
                                                    value={currentElement.color}
                                                    onChange={(e) => updateElement('text', currentElement.id, { color: e.target.value })}
                                                />
                                            </div>
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Cor de Fundo</label>
                                            <div style={{ marginBottom: '0.5rem' }}>
                                                <button
                                                    className="btn btn-secondary"
                                                    style={{ width: '100%', justifyContent: 'center', fontSize: '0.85rem' }}
                                                    onClick={() => updateElement('text', currentElement.id, { backgroundColor: 'transparent' })}
                                                >
                                                    🚫 Sem Fundo (Transparente)
                                                </button>
                                            </div>
                                            <div className="color-picker-wrapper">
                                                <div
                                                    className="color-preview"
                                                    style={{ background: currentElement.backgroundColor === 'transparent' ? 'linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc), linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc)' : currentElement.backgroundColor,
                                                        backgroundSize: '20px 20px',
                                                        backgroundPosition: '0 0, 10px 10px'
                                                    }}
                                                ></div>
                                                <input
                                                    type="color"
                                                    className="input"
                                                    value={currentElement.backgroundColor?.replace(/rgba?\((\d+),\s*(\d+),\s*(\d+).*\)/, (_, r, g, b) =>
                                                        `#${parseInt(r).toString(16).padStart(2, '0')}${parseInt(g).toString(16).padStart(2, '0')}${parseInt(b).toString(16).padStart(2, '0')}`
                                                    ) || '#000000'}
                                                    onChange={(e) => updateElement('text', currentElement.id, { backgroundColor: e.target.value })}
                                                />
                                            </div>
                                            <div style={{ marginTop: '0.5rem' }}>
                                                <label className="label" style={{ fontSize: '0.85rem' }}>Gradientes:</label>
                                                <div className="gradient-grid">
                                                    {GRADIENTS.map((gradient, i) => (
                                                        <div
                                                            key={i}
                                                            className="gradient-option"
                                                            style={{ background: gradient }}
                                                            onClick={() => updateElement('text', currentElement.id, { backgroundColor: gradient })}
                                                        ></div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Alinhamento</label>
                                            <select
                                                className="input"
                                                value={currentElement.textAlign}
                                                onChange={(e) => updateElement('text', currentElement.id, { textAlign: e.target.value })}
                                            >
                                                <option value="left">Esquerda</option>
                                                <option value="center">Centro</option>
                                                <option value="right">Direita</option>
                                            </select>
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Peso da Fonte</label>
                                            <select
                                                className="input"
                                                value={currentElement.fontWeight}
                                                onChange={(e) => updateElement('text', currentElement.id, { fontWeight: e.target.value })}
                                            >
                                                <option value="400">Normal</option>
                                                <option value="600">Semi-Bold</option>
                                                <option value="700">Bold</option>
                                                <option value="800">Extra-Bold</option>
                                                <option value="900">Black</option>
                                            </select>
                                        </div>

                                        <div style={{ marginBottom: '1rem' }}>
                                            <label className="label">Padding: {currentElement.padding}px</label>
                                            <input
                                                type="range"
                                                className="slider"
                                                min="0"
                                                max="50"
                                                value={currentElement.padding}
                                                onChange={(e) => updateElement('text', currentElement.id, { padding: parseInt(e.target.value) })}
                                            />
                                        </div>
                                    </>
                                ) : (
                                    <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-secondary)' }}>
                                        <p style={{ fontSize: '2rem', marginBottom: '1rem' }}>🖼️</p>
                                        <p style={{ fontSize: '1rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                            Imagem Selecionada
                                        </p>
                                        <p style={{ fontSize: '0.9rem' }}>
                                            Redimensione arrastando a bolinha azul
                                        </p>
                                    </div>
                                )}

                                <button
                                    className="btn btn-danger"
                                    style={{ width: '100%', justifyContent: 'center', marginTop: '1rem' }}
                                    onClick={() => deleteElement(selectedElement.type, selectedElement.id)}
                                >
                                    🗑️ Deletar Elemento
                                </button>
                            </div>
                        ) : (
                            <div className="card">
                                <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-secondary)' }}>
                                    <p style={{ fontSize: '3rem', marginBottom: '1rem' }}>👆</p>
                                    <p style={{ fontSize: '1.1rem', fontWeight: '600', marginBottom: '0.5rem' }}>
                                        Selecione um elemento
                                    </p>
                                    <p style={{ fontSize: '0.9rem', marginBottom: '1rem' }}>
                                        Clique em um texto ou imagem no canvas
                                    </p>
                                    <div style={{ background: 'var(--bg-hover)', padding: '1rem', borderRadius: '0.5rem', marginTop: '1rem' }}>
                                        <p style={{ fontSize: '0.85rem', marginBottom: '0.5rem' }}>💡 <strong>Dicas:</strong></p>
                                        <ul style={{ textAlign: 'left', fontSize: '0.85rem', paddingLeft: '1.5rem' }}>
                                            <li>Arraste elementos para reposicionar</li>
                                            <li>Arraste a bolinha azul para redimensionar</li>
                                            <li>Use ⬆️⬇️ para controlar camadas</li>
                                            <li>Funciona no celular também!</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const { user, profile, loading, signOut } = useAuth();

            if (loading) {
                return (
                    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div className="loading" style={{ width: '40px', height: '40px' }}></div>
                            <p style={{ marginTop: '1rem', color: 'var(--text-secondary)' }}>Carregando...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <LoginPage />;
            }

            return (
                <>
                    <header className="header">
                        <div className="container">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div className="logo">CARROGEN PRO V2.2.0</div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                    {profile?.instagram_handle && (
                                        <span style={{ color: 'var(--text-secondary)' }}>
                                            {profile.instagram_handle}
                                        </span>
                                    )}
                                    <button className="btn btn-secondary" onClick={signOut}>
                                        Sair
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main style={{ padding: '2rem 0' }}>
                        <div className="container">
                            <EditorV2 />
                        </div>
                    </main>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AuthProvider>
                <App />
            </AuthProvider>
        );
    </script>
</body>
</html>
